<!DOCTYPE html>
<html>
<head>
<style> 

div {
  width: 120px;
  height: 200px;
  background: red;
  position: relative;
  animation-name: myAnimation;
  animation-duration: 0.5s;  
  animation-delay: 1s;
  animation-iteration-count: infinite;
}

div {
  width: 40px;
  height: 50px;
  background: rgb(172, 20, 185);
  position: relative;
  animation-name: yourAnimation;
  animation-duration: 0.5s;  
  animation-delay: 1s;
  animation-iteration-count: infinite;
}

@keyframes yourAnimation {
  0%   {background-color:rgb(203, 99, 235); left:750px; top:0px;}
  25%  {background-color:rgb(90, 30, 102); left:750px; top:500px;}
  30%  {}    
  50%  {background-color:rgb(141, 10, 124); left:250px; top:500px;}
  60%  {}
  75%  {background-color:rgb(236, 81, 190); left:250px; top:500px;}
  100% {background-color:rgb(155, 39, 223); left:0px; top:0px;}
}

</style>
</head>
<body>

<h1>CSS Animation</h1>

<div></div>

<p><b>Note:</b> When an animation is finished, it goes back to its original style.</p>

</body>
</html>
